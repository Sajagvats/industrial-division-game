<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#1c0c05"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Inner Rim -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#f97316" stroke-width="6" stroke-opacity="0.4"/>
  
  <!-- Factory & Gear Graphic -->
  <g filter="url(#glow)">
    <!-- Factory Silhouette Base -->
    <path d="M96 384 L96 260 L180 200 L180 260 L260 200 L260 160 L340 160 L340 384 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Factory Chimneys -->
    <rect x="360" y="140" width="44" height="244" fill="#fb923c"/>
    <rect x="352" y="128" width="60" height="20" rx="4" fill="#fed7aa"/>
    <!-- Factory Windows -->
    <rect x="124" y="290" width="32" height="48" rx="6" fill="#1c0c05"/>
    <rect x="200" y="290" width="32" height="48" rx="6" fill="#1c0c05"/>
    <rect x="280" y="240" width="32" height="48" rx="6" fill="#1c0c05"/>
    <rect x="280" y="310" width="32" height="48" rx="6" fill="#1c0c05"/>
  </g>
  
  <!-- Golden Indian Rupee Symbol Badge -->
  <g filter="url(#glow)">
    <circle cx="380" cy="360" r="90" fill="url(#goldGrad)" stroke="#78350f" stroke-width="6"/>
    <text x="380" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="#1c0c05" text-anchor="middle">₹</text>
  </g>

  <!-- Crown / Star Accent -->
  <polygon points="256,70 274,106 314,112 285,140 292,180 256,161 220,180 227,140 198,112 238,106" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
</svg>
